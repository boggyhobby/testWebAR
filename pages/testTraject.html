<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>Marker-based WebAR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #hint {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
      text-shadow: 0 0 5px black;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div id="hint">Hiroマーカーをカメラに映してください</div>

  <a-scene
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true;"
  >

    <!-- マーカー -->
    <a-marker preset="hiro" id="marker">

      <!-- GLBモデル -->
      <a-entity
        id="model"
        gltf-model="kamakura.glb"
        scale="0.1 0.1 0.1"
        position="0 0 0"
        path-animation
      ></a-entity>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    <!-- /* ===== 軌跡アニメーション ===== */ -->
    AFRAME.registerComponent("path-animation", {
      schema: {
        duration: { type: "number", default: 5000 }
      },

      init: function () {
        this.path = [
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0.4, 0, 0),
          new THREE.Vector3(0.4, 0, -0.4),
          new THREE.Vector3(0, 0, -0.4)
        ];
        this.startTime = null;
        this.isPlaying = false;
      },

      start: function () {
        this.startTime = null;
        this.isPlaying = true;
      },

      tick: function (time) {
        if (!this.isPlaying) return;
        if (!this.startTime) this.startTime = time;

        const t = (time - this.startTime) / this.data.duration;
        if (t >= 1) {
          this.isPlaying = false;
          return;
        }

        const segments = this.path.length - 1;
        const progress = t * segments;
        const i = Math.floor(progress);
        const lt = progress - i;

        const from = this.path[i];
        const to = this.path[i + 1] || from;

        const pos = new THREE.Vector3().lerpVectors(from, to, lt);
        this.el.object3D.position.copy(pos);
      }
    });

    <!-- /* ===== マーカー検出で再生 ===== */ -->
    const marker = document.querySelector("#marker");
    const model = document.querySelector("#model");

    marker.addEventListener("markerFound", () => {
      model.components["path-animation"].start();
    });
  </script>
</body>
</html>
