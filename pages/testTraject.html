<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame WebAR Path Animation</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
<a-scene embedded arjs>
  
  <!-- マーカー -->
  <a-marker preset="hiro">

    <!-- 動かすオブジェクト -->
    <a-sphere id="mover" radius="0.03" color="red"></a-sphere>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  <!-- // ① 事前に作った軌跡（メートル単位） -->
  const path = [
    {x: 0,   y: 0.02, z: 0},
    {x: 0.1, y: 0.05, z: -0.1},
    {x: 0.2, y: 0.1,  z: -0.2},
    {x: 0.3, y: 0.05, z: -0.3},
    {x: 0.4, y: 0.1,  z: -0.4},
    {x: 0.5, y: 0.05, z: -0.5},
    {x: 0.6, y: 0.1,  z: -0.6},
    {x: 0.7, y: 0.05, z: -0.7},
    {x: 0.8, y: 0.1,  z: -0.8},
    {x: 0.9, y: 0.05, z: -0.9}
  ];

  const mover = document.querySelector('#mover');
  let index = 0;

  <!-- // ② アニメーション -->
  function animatePath() {
    mover.setAttribute('position', path[index]);
    index++;
    if (index < path.length) {
      setTimeout(animatePath, 1000); // 速度調整
    }
  }

  <!-- // マーカー検出後に開始 -->
  document.querySelector('a-marker').addEventListener('markerFound', () => {
    index = 0;
    animatePath();
  });
</script>
</body>
</html>
